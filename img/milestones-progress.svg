<svg width="800" height="260" viewBox="0 0 800 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-milestones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#151D33" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-milestones" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.6" />
    </linearGradient>

    <!-- Progress Gradients -->
    <linearGradient id="grad-m1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="grad-m2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="grad-m3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-m4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseBorder {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 0.9; }
    }
    .card-border {
      animation: pulseBorder 4s ease-in-out infinite;
    }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="798" height="258" rx="16" fill="url(#bg-milestones)" stroke="url(#border-milestones)" stroke-width="1.5" class="card-border" />

  <!-- Header -->
  <g transform="translate(30, 22)">
    <rect width="36" height="36" rx="9" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="18" y="24" font-size="18" text-anchor="middle">🎯</text>

    <text x="48" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Project Milestones &amp; Learning Roadmap</text>
    <text x="48" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Fokus pengembangan dan target implementasi saat ini</text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="68" x2="770" y2="68" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />

  <!-- Milestone 1: MyDuit (85%) -->
  <g transform="translate(30, 80)">
    <circle cx="10" cy="14" r="6" fill="#38BDF8" fill-opacity="0.25" />
    <circle cx="10" cy="14" r="3.5" fill="#38BDF8" />
    <text x="28" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">MyDuit: Smart Finance Tracker (Gemini AI + GAS + Tailwind)</text>
    <text x="560" y="18" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="end">Beta Release</text>
    
    <!-- Track -->
    <rect x="580" y="8" width="130" height="12" rx="6" fill="#131D33" stroke="#233554" stroke-width="1" />
    <!-- Bar with Animation (85% of 130 = 110) -->
    <rect x="580" y="8" width="110" height="12" rx="6" fill="url(#grad-m1)">
      <animate attributeName="width" from="0" to="110" dur="1.2s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" />
    </rect>
    <rect x="580" y="8" width="110" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.15" />

    <text x="735" y="18" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="12" font-weight="700">85%</text>
  </g>

  <!-- Milestone 2: Modern Full-Stack (80%) -->
  <g transform="translate(30, 118)">
    <circle cx="10" cy="14" r="6" fill="#818CF8" fill-opacity="0.25" />
    <circle cx="10" cy="14" r="3.5" fill="#818CF8" />
    <text x="28" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Full-Stack Architecture (Laravel 11, TypeScript, REST APIs)</text>
    <text x="560" y="18" fill="#818CF8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="end">Production Ready</text>
    
    <!-- Track -->
    <rect x="580" y="8" width="130" height="12" rx="6" fill="#131D33" stroke="#233554" stroke-width="1" />
    <!-- Bar with Animation (80% of 130 = 104) -->
    <rect x="580" y="8" width="104" height="12" rx="6" fill="url(#grad-m2)">
      <animate attributeName="width" from="0" to="104" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" />
    </rect>
    <rect x="580" y="8" width="104" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.15" />

    <text x="735" y="18" fill="#818CF8" font-family="'Fira Code', monospace" font-size="12" font-weight="700">80%</text>
  </g>

  <!-- Milestone 3: AI Integration & Automation (75%) -->
  <g transform="translate(30, 156)">
    <circle cx="10" cy="14" r="6" fill="#C084FC" fill-opacity="0.25" />
    <circle cx="10" cy="14" r="3.5" fill="#C084FC" />
    <text x="28" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AI Integration &amp; LLM Automation (Gemini API, Tooling)</text>
    <text x="560" y="18" fill="#C084FC" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="end">Active R&amp;D</text>
    
    <!-- Track -->
    <rect x="580" y="8" width="130" height="12" rx="6" fill="#131D33" stroke="#233554" stroke-width="1" />
    <!-- Bar with Animation (75% of 130 = 98) -->
    <rect x="580" y="8" width="98" height="12" rx="6" fill="url(#grad-m4)">
      <animate attributeName="width" from="0" to="98" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" />
    </rect>
    <rect x="580" y="8" width="98" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.15" />

    <text x="735" y="18" fill="#C084FC" font-family="'Fira Code', monospace" font-size="12" font-weight="700">75%</text>
  </g>

  <!-- Milestone 4: Mobile & ERP Integration (70%) -->
  <g transform="translate(30, 194)">
    <circle cx="10" cy="14" r="6" fill="#34D399" fill-opacity="0.25" />
    <circle cx="10" cy="14" r="3.5" fill="#34D399" />
    <text x="28" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Mobile &amp; Enterprise Solutions (Flutter x Odoo ERP)</text>
    <text x="560" y="18" fill="#34D399" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="end">Core Done</text>
    
    <!-- Track -->
    <rect x="580" y="8" width="130" height="12" rx="6" fill="#131D33" stroke="#233554" stroke-width="1" />
    <!-- Bar with Animation (70% of 130 = 91) -->
    <rect x="580" y="8" width="91" height="12" rx="6" fill="url(#grad-m3)">
      <animate attributeName="width" from="0" to="91" dur="1.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" />
    </rect>
    <rect x="580" y="8" width="91" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.15" />

    <text x="735" y="18" fill="#34D399" font-family="'Fira Code', monospace" font-size="12" font-weight="700">70%</text>
  </g>

  <!-- Footer Tag -->
  <text x="770" y="246" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="end">Continuously building &amp; delivering real-world impact</text>
</svg>